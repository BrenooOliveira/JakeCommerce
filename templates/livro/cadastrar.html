<form th:action="@{/livros}" method="post" class="row g-3">

    <div class="col-md-4">
        <label>Código</label>
        <input type="text" name="codigo" class="form-control" required>
    </div>

    <div class="col-md-8">
        <label>Título</label>
        <input type="text" name="titulo" class="form-control" required>
    </div>

    <div class="col-md-3">
        <label>Ano</label>
        <input type="number" name="ano" class="form-control" required>
    </div>

    <div class="col-md-3">
        <label>Edição</label>
        <input type="text" name="edicao" class="form-control">
    </div>

    <div class="col-md-6">
        <label>ISBN</label>
        <input type="text" name="isbn" class="form-control" required>
    </div>

    <div class="col-md-4">
        <label>Grupo Precificação</label>
        <select name="grupoPrecificacaoId" class="form-select" required>
            <option th:each="grupo : ${grupos}"
                    th:value="${grupo.id}"
                    th:text="${grupo.nome}">
            </option>
        </select>
    </div>

    <div class="col-md-4">
        <label>Editora</label>
        <select name="editoraId" class="form-select" required>
            <option th:each="editora : ${editoras}"
                    th:value="${editora.id}"
                    th:text="${editora.nome}">
            </option>
        </select>
    </div>

    <div class="col-md-4">
        <label>Categorias</label>
        <select name="categoriasIds" multiple class="form-select" required>
            <option th:each="categoria : ${categorias}"
                    th:value="${categoria.id}"
                    th:text="${categoria.nome}">
            </option>
        </select>
    </div>

    <div class="col-12">
        <label>Sinopse</label>
        <textarea name="sinopse" class="form-control" rows="3"></textarea>
    </div>

    <button type="submit" class="btn btn-primary">
        Cadastrar
    </button>
</form>
