<h3>Finalizar Compra</h3>

<form th:action="@{/pedido/finalizar}" method="post">

    <h5>Endereço de Entrega</h5>

    <select name="enderecoId" class="form-select mb-3">
        <option th:each="endereco : ${cliente.enderecos}"
                th:value="${endereco.id}"
                th:text="${endereco.logradouro}">
        </option>
    </select>

    <h5>Pagamento</h5>

    <label>Cupom</label>
    <input type="text" name="codigoCupom" class="form-control mb-3">

    <div th:each="cartao : ${cliente.cartoes}" class="mb-3">
        <label th:text="${cartao.bandeira}"></label>
        <input type="number"
               name="valoresCartao"
               min="10"
               class="form-control">
    </div>

    <div class="alert alert-info">
        Pedido mínimo: R$ 20,00 (sem frete)
    </div>

    <button type="submit" class="btn btn-success">
        Confirmar Pedido
    </button>

</form>
