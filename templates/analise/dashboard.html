<h3>Análise de Vendas</h3>

<form method="get">

    <input type="date" name="inicio" class="form-control mb-2">
    <input type="date" name="fim" class="form-control mb-2">

    <select name="tipoComparacao" class="form-select mb-3">
        <option value="PRODUTO">Produto</option>
        <option value="CATEGORIA">Categoria</option>
    </select>

    <button class="btn btn-primary">Analisar</button>
</form>

<canvas id="graficoVendas"></canvas>
