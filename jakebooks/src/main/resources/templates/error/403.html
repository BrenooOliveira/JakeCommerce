<!DOCTYPE html>
<html 
    xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{fragments/layout}"
    lang="pt-BR">
<head>
    <title>Acesso Negado - 403</title>
</head>
<body>
    <div layout:fragment="content" class="container-fluid">
        <div class="row justify-content-center mt-5">
            <div class="col-md-6">
                <div class="alert alert-danger border-start border-danger border-5" role="alert">
                    <h1 class="display-1 text-danger">
                        <i class="bi bi-exclamation-triangle"></i> 403
                    </h1>
                    <h2 class="h3">Acesso Negado</h2>
                    <p class="lead text-muted">
                        Desculpe, você não tem permissão para acessar este recurso.
                    </p>
                    <hr>
                    <p class="text-muted">
                        Se acredita que isto é um erro, contacte o administrador do sistema.
                    </p>
                    <a href="/" class="btn btn-danger mt-3">
                        <i class="bi bi-house-door"></i> Voltar à página inicial
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
