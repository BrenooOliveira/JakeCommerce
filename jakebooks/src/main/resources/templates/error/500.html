<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}"
      lang="pt-BR">
<head>
    <title>Erro no servidor</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="container-fluid d-flex align-items-center justify-content-center" style="min-height: 60vh;">
            <div class="text-center">
                <div class="display-1 fw-bold text-danger mb-3">
                    <i class="bi bi-exclamation-circle"></i> 500
                </div>
                <h1 class="display-5 mb-3">Erro no servidor</h1>
                <p class="lead text-muted mb-4">
                    Oops! Algo deu errado no nosso lado. Nossa equipe já foi notificada.
                </p>
                <p class="text-muted mb-4" th:if="${exception}">
                    <code th:text="${exception.message}"></code>
                </p>
                <div class="d-flex gap-2 justify-content-center">
                    <a href="/" class="btn btn-primary btn-lg">
                        <i class="bi bi-house"></i> Voltar à Home
                    </a>
                    <a href="javascript:history.back()" class="btn btn-outline-secondary btn-lg">
                        <i class="bi bi-arrow-left"></i> Voltar
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
