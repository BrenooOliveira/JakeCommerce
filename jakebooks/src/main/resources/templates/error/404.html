<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}"
      lang="pt-BR">
<head>
    <title>Página não encontrada</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="container-fluid d-flex align-items-center justify-content-center" style="min-height: 60vh;">
            <div class="text-center">
                <div class="display-1 fw-bold text-danger mb-3">
                    <i class="bi bi-exclamation-triangle"></i> 404
                </div>
                <h1 class="display-5 mb-3">Página não encontrada</h1>
                <p class="lead text-muted mb-4">
                    Desculpe, a página que você está procurando não existe ou foi removida.
                </p>
                <div class="d-flex gap-2 justify-content-center">
                    <a href="/" class="btn btn-primary btn-lg">
                        <i class="bi bi-house"></i> Voltar à Home
                    </a>
                    <a href="javascript:history.back()" class="btn btn-outline-secondary btn-lg">
                        <i class="bi bi-arrow-left"></i> Voltar
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
