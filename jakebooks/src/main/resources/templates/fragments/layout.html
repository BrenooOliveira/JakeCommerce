<!DOCTYPE html>
<html 
    xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title layout:title-pattern="$LAYOUT_TITLE - $CONTENT_TITLE">Livraria</title>

    <!-- Bootstrap CSS -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
        rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" 
        rel="stylesheet">

    <!-- Custom CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
    <!-- Navbar -->
    <div th:insert="~{fragments/navbar :: navbar}"></div>

    <!-- Container principal com sidebar (se estiver em admin) -->
    <div class="container-fluid mt-4">
        <div class="row">
            <!-- Sidebar (visível apenas em telas maiores quando isAdmin=true) -->
            <div 
                th:class="${isAdmin == true} ? 'col-md-3 col-lg-2 d-md-block bg-light sidebar py-4' : 'd-none'">
                <div th:insert="~{fragments/sidebar :: sidebar}"></div>
            </div>

            <!-- Conteúdo Principal -->
            <main th:class="${isAdmin == true} ? 'col-md-9 col-lg-10' : 'col-12'">
                <!-- Mensagens Flash -->
                <div th:insert="~{fragments/messages :: messages}"></div>

                <!-- Conteúdo específico de cada página -->
                <div layout:fragment="content"></div>
            </main>
        </div>
    </div>

    <!-- Footer -->
    <div th:insert="~{fragments/footer :: footer}"></div>

    <!-- Bootstrap JS Bundle (inclui Popper) -->
    <script 
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- Scripts customizados -->
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
