<!DOCTYPE html>
<html 
    xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title layout:title-pattern="$LAYOUT_TITLE - $CONTENT_TITLE">Livraria</title>

    <!-- Bootstrap CSS -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
        rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" 
        rel="stylesheet">

    <!-- Custom CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
    <!-- Navbar -->
    <div th:insert="~{fragments/navbar :: navbar}"></div>

    <!-- Container principal com sidebar (se estiver em admin) -->
    <div class="container-fluid mt-4">
        <div class="row">
            <!-- Sidebar (APENAS para admin) -->
            <div sec:authorize="hasRole('ADMIN')" class="col-md-3 col-lg-2 d-md-block bg-light sidebar py-4">
                <div th:replace="~{fragments/sidebar :: sidebar}"></div>
            </div>

            <!-- Conteúdo Principal -->
            <main th:class="${painelAdmin} ? 'col-md-9 ms-sm-auto col-lg-10' : 'col-12'">
                <!-- Contexto administrativo global para evitar perda de navegacao -->
                <div sec:authorize="hasRole('ADMIN')" class="alert alert-warning border-start border-4 border-warning d-flex justify-content-between align-items-center" role="alert">
                    <div>
                        <strong><i class="bi bi-shield-check"></i> Area Administrativa</strong>
                        <span class="ms-2 text-muted">Voce esta operando funcoes de gestao.</span>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <span class="badge text-bg-light" th:text="${requestURI}">/admin</span>
                        <a th:href="@{/admin}" class="btn btn-sm btn-outline-dark">Painel</a>
                    </div>
                </div>

                <!-- Mensagens Flash -->
                <div th:replace="~{fragments/messages :: messages}"></div>

                <!-- Conteúdo específico de cada página -->
                <div layout:fragment="content"></div>
            </main>
        </div>
    </div>

    <!-- Footer -->
    <div th:insert="~{fragments/footer :: footer}"></div>

    <!-- Bootstrap JS Bundle (inclui Popper) -->
    <script 
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- Scripts customizados -->
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
