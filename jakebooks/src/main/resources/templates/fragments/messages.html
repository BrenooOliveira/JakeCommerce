<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="messages" >
        <div th:if="${msgSucesso != null or msgErro != null or msgAviso != null or msgInfo != null}"  class="container mt-4"
            th:with="
                msgSucesso=${mensagemSucesso} ?: session.mensagemSucesso,
                msgErro=${mensagemErro} ?: session.mensagemErro,
                msgAviso=${mensagemAviso} ?: session.mensagemAviso,
                msgInfo=${mensagemInfo} ?: session.mensagemInfo
            ">
            <!-- Mensagem de Sucesso (Verde) -->
            <div 
                th:if="${msgSucesso}" 
                class="alert alert-success alert-dismissible fade show" 
                role="alert">
                <i class="bi bi-check-circle"></i>
                <strong>Sucesso!</strong> 
                <span th:text="${msgSucesso}"></span>
                <button 
                    type="button" 
                    class="btn-close" 
                    data-bs-dismiss="alert" 
                    aria-label="Close"></button>
            </div>

            <!-- Mensagem de Erro (Vermelho) -->
            <div 
                th:if="${msgErro}" 
                class="alert alert-danger alert-dismissible fade show" 
                role="alert">
                <i class="bi bi-exclamation-circle"></i>
                <strong>Erro!</strong> 
                <span th:text="${msgErro}"></span>
                <button 
                    type="button" 
                    class="btn-close" 
                    data-bs-dismiss="alert" 
                    aria-label="Close"></button>
            </div>

            <!-- Mensagem de Aviso (Amarelo) -->
            <div 
                th:if="${msgAviso}" 
                class="alert alert-warning alert-dismissible fade show" 
                role="alert">
                <i class="bi bi-exclamation-triangle"></i>
                <strong>Aviso!</strong> 
                <span th:text="${msgAviso}"></span>
                <button 
                    type="button" 
                    class="btn-close" 
                    data-bs-dismiss="alert" 
                    aria-label="Close"></button>
            </div>

            <!-- Mensagem de Informação (Azul) -->
            <div 
                th:if="${msgInfo}" 
                class="alert alert-info alert-dismissible fade show" 
                role="alert">
                <i class="bi bi-info-circle"></i>
                <span th:text="${msgInfo}"></span>
                <button 
                    type="button" 
                    class="btn-close" 
                    data-bs-dismiss="alert" 
                    aria-label="Close"></button>
            </div>
        </div>
    </div>
</body>
</html>
