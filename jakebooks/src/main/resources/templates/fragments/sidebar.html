<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <nav th:fragment="sidebar" class="sidebar">
        <div class="position-sticky pt-3">
            <h5 class="text-uppercase text-muted px-3 mb-3">
                <i class="bi bi-shield-check"></i> Painel Administrativo
            </h5>

            <ul class="nav flex-column">
                <!-- Dashboard/Home -->
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin}">
                        <i class="bi bi-speedometer2"></i> Dashboard
                    </a>
                </li>

                <hr class="my-2 mx-3">

                <!-- Livros -->
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/livros}">
                        <i class="bi bi-book-half"></i> Livros
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/livros/novo}">
                        <i class="bi bi-plus-circle"></i> Novo Livro
                    </a>
                </li>

                <hr class="my-2 mx-3">

                <!-- Clientes -->
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/clientes}">
                        <i class="bi bi-people"></i> Clientes
                    </a>
                </li>

                <hr class="my-2 mx-3">

                <!-- Pedidos -->
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/pedidos}">
                        <i class="bi bi-box-seam"></i> Pedidos
                    </a>
                </li>

                <!-- Trocas -->
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/trocas}">
                        <i class="bi bi-arrow-left-right"></i> Trocas
                    </a>
                </li>

                <hr class="my-2 mx-3">

                <!-- Estoque -->
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/estoque}">
                        <i class="bi bi-boxes"></i> Estoque
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/estoque/entrada}">
                        <i class="bi bi-plus-square"></i> Entrada de Estoque
                    </a>
                </li>

                <hr class="my-2 mx-3">

                <!-- Análises -->
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/analise}">
                        <i class="bi bi-graph-up"></i> Análises
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <style>
    .sidebar {
        position: fixed;
        top: 56px; /* Altura do navbar */
        bottom: 0;
        left: 0;
        z-index: 100;
        padding: 0;
        overflow-x: hidden;
        overflow-y: auto;
        border-right: 1px solid #dee2e6;
        background-color: #f8f9fa;
    }

    .sidebar .nav-link {
        font-weight: 500;
        color: #333;
        padding: 0.75rem 1rem;
        transition: all 0.2s ease;
    }

    .sidebar .nav-link:hover {
        color: #0d6efd;
        background-color: #e9ecef;
    }

    .sidebar .nav-link.active {
        color: #0d6efd;
        background-color: #e7f1ff;
        border-left: 3px solid #0d6efd;
    }

    .sidebar .nav-link i {
        margin-right: 0.5rem;
        width: 1.25rem;
        text-align: center;
    }

    .sidebar h5 {
        font-size: 0.875rem;
        letter-spacing: 0.05em;
    }

    .sidebar hr {
        border-color: #dee2e6;
    }
    </style>
</body>
</html>
