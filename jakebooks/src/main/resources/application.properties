# Application Name
spring.application.name=JakeBooks

# ============================================================================
# SERVER CONFIGURATION
# ============================================================================
server.port=8080
server.servlet.context-path=/
server.servlet.session.timeout=30m

# ============================================================================
# DATABASE CONFIGURATION
# ============================================================================
# Using environment variables for credentials
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jakebooks}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# ============================================================================
# JPA/HIBERNATE CONFIGURATION
# ============================================================================
# Schema is created automatically by Hibernate during development
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Development settings
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# ============================================================================
# SQL SCRIPTS INITIALIZATION
# ============================================================================
# Hibernate manages the schema, but we execute data.sql for initial data
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:noop-schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=false
spring.jpa.defer-datasource-initialization=true

# ============================================================================
# THYMELEAF CONFIGURATION
# ============================================================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
spring.thymeleaf.enable-spring-el-compiler=true

# ============================================================================
# SPRING SECURITY CONFIGURATION
# ============================================================================
# Autenticação via CustomUserDetailsService (sem usuário in-memory)

# Session configuration
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.max-age=1800

# ============================================================================
# MULTIPART CONFIGURATION
# ============================================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# ============================================================================
# LOGGING CONFIGURATION
# ============================================================================
logging.level.root=INFO
logging.level.com.les.jakebooks=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Log format
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ============================================================================
# DEVELOPMENT SETTINGS
# ============================================================================
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=false

# ============================================================================
# ERROR HANDLING
# ============================================================================
server.error.include-message=always
server.error.include-stacktrace=on_param
server.error.include-exception=false
server.error.include-binding-errors=always
